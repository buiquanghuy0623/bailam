<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub Dashboard - Refactored</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- 1. NAVBAR: Dùng Flexbox (1D) cho component điều hướng linh hoạt -->
    <nav class="app-navbar">
        <div class="nav-logo fw-bold">MetricsHub</div>
        <div class="nav-links d-none d-md-flex">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">VeryLongGermanWordForDashboard</a>
            <a href="#">Contact</a>
        </div>
        <div class="nav-profile">Profile</div>
    </nav>

    <div class="container my-4">
        <!-- 2. DASHBOARD: Dùng CSS Grid (2D) với cấu trúc phẳng (Shallow DOM) -->
        <section class="grid-dashboard mb-5">
            <div class="widget widget-large">Chart A (Span 2 rows)</div>
            <div class="widget">Chart B</div>
            <div class="widget">Chart C</div>
            <div class="widget">Chart D</div>
        </section>

        <!-- 3. PRICING: Tận dụng hệ thống lưới 12 cột của Bootstrap -->
        <section class="container pricing-section">
            <div class="row g-4 text-center">
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100 p-4">
                        <h3>Gói Cơ bản</h3>
                        <p class="text-muted">Phù hợp cá nhân</p>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100 p-4 border-primary">
                        <h3>Gói Nâng cao</h3>
                        <p class="text-muted">Phù hợp startup</p>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100 p-4">
                        <h3>Gói Doanh nghiệp</h3>
                        <p class="text-muted">Giải pháp toàn diện</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
